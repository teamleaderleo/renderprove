name: Synthetic Cloudflare vision wire spike

on:
  push:
    branches:
      - docs/issue-29-cloudflare-vision-findings

permissions:
  contents: read
  issues: write

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Run generated-image spike
        run: node scripts/vision-wire-spike.mjs test-results/vision-wire-spike.json
      - name: Verify bounded result
        run: |
          node - <<'NODE'
          const value = require('./test-results/vision-wire-spike.json');
          if (value.schemaVersion !== 'cloudflare-vision-wire-spike-v1') process.exit(1);
          if (value.privateDataRecorded !== false) process.exit(1);
          if (value.syntheticImage?.generatedOnly !== true || value.syntheticImage?.privateBytesRetained !== false) process.exit(1);
          if (!Array.isArray(value.probes) || value.probes.length < 10) process.exit(1);
          const forbidden = ['prompt', 'requestBody', 'rawResponse', 'authorization', 'apiToken', 'imageBase64', 'dataUri'];
          const text = JSON.stringify(value).toLowerCase();
          if (forbidden.some((key) => text.includes(key.toLowerCase()))) process.exit(1);
          console.log(JSON.stringify({
            selectedCandidate: value.selectedCandidate,
            repeatability: value.repeatability,
            probeCount: value.probes.length,
            privateDataRecorded: value.privateDataRecorded,
          }));
          NODE
      - name: Post bounded findings to issue 32
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(fs.readFileSync('test-results/vision-wire-spike.json', 'utf8'));
          const marker = `<!-- cloudflare-vision-wire-spike:${process.env.GITHUB_SHA} -->`;
          const body = `${marker}\n## Authenticated synthetic wire spike\n\n` +
            `Generated-image experiment. The attached JSON contains bounded metadata only.\n\n` +
            '```json\n' + JSON.stringify(value, null, 2) + '\n```';
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/issues/32/comments`, {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28',
            },
            body: JSON.stringify({ body }),
          });
          if (!response.ok) throw new Error(`GitHub comment failed with ${response.status}`);
          console.log(`Posted bounded findings with status ${response.status}.`);
          NODE
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-vision-wire-spike-bounded
          path: test-results/vision-wire-spike.json
          if-no-files-found: error
          retention-days: 1
