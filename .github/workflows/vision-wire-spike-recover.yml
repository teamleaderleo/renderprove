name: Recover bounded Cloudflare vision spike result

on:
  pull_request:
    paths:
      - .github/workflows/vision-wire-spike-recover.yml

permissions:
  contents: read
  issues: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Recover bounded issue comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/issues/32/comments?per_page=100`, {
            headers: {
              Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
            },
          });
          if (!response.ok) throw new Error(`Comment fetch failed with ${response.status}`);
          const comments = await response.json();
          const comment = [...comments].reverse().find((item) => item.body?.includes('<!-- cloudflare-vision-wire-spike:'));
          if (!comment) throw new Error('Bounded spike comment was not found.');
          const match = /```json\n([\s\S]*?)\n```/.exec(comment.body);
          if (!match) throw new Error('Bounded spike JSON block was not found.');
          const value = JSON.parse(match[1]);
          if (value.schemaVersion !== 'cloudflare-vision-wire-spike-v1') throw new Error('Unexpected result schema.');
          if (value.privateDataRecorded !== false || value.syntheticImage?.privateBytesRetained !== false) {
            throw new Error('Privacy invariant failed.');
          }
          const forbidden = ['prompt', 'requestBody', 'rawResponse', 'authorization', 'apiToken', 'imageBase64', 'dataUri'];
          const text = JSON.stringify(value).toLowerCase();
          if (forbidden.some((key) => text.includes(key.toLowerCase()))) throw new Error('Forbidden field found.');
          fs.mkdirSync('test-results', { recursive: true });
          fs.writeFileSync('test-results/cloudflare-vision-wire-spike-empirical.json', `${JSON.stringify(value, null, 2)}\n`, { mode: 0o600 });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-vision-wire-spike-recovered
          path: test-results/cloudflare-vision-wire-spike-empirical.json
          if-no-files-found: error
          retention-days: 1
