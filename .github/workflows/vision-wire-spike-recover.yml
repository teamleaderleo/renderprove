name: Inspect Cloudflare vision spike run

on:
  pull_request:
    paths:
      - .github/workflows/vision-wire-spike-recover.yml

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Collect bounded run diagnostics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const headers = {
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
          };
          const base = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}`;
          const runsResponse = await fetch(`${base}/actions/workflows/vision-wire-spike.yml/runs?branch=docs%2Fissue-29-cloudflare-vision-findings&event=push&per_page=10`, { headers });
          if (!runsResponse.ok) throw new Error(`Run list failed with ${runsResponse.status}`);
          const runPayload = await runsResponse.json();
          const runs = [];
          for (const run of (runPayload.workflow_runs ?? []).slice(0, 5)) {
            const jobsResponse = await fetch(`${base}/actions/runs/${run.id}/jobs?per_page=100`, { headers });
            const jobsPayload = jobsResponse.ok ? await jobsResponse.json() : { jobs: [] };
            runs.push({
              id: run.id,
              runNumber: run.run_number,
              headSha: run.head_sha,
              status: run.status,
              conclusion: run.conclusion,
              createdAt: run.created_at,
              updatedAt: run.updated_at,
              jobs: (jobsPayload.jobs ?? []).map((job) => ({
                id: job.id,
                name: job.name,
                status: job.status,
                conclusion: job.conclusion,
                steps: (job.steps ?? []).map((step) => ({
                  name: step.name,
                  status: step.status,
                  conclusion: step.conclusion,
                })),
              })),
            });
          }
          fs.mkdirSync('test-results', { recursive: true });
          fs.writeFileSync('test-results/cloudflare-vision-spike-run-diagnostics.json', `${JSON.stringify({ runs }, null, 2)}\n`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-vision-spike-run-diagnostics
          path: test-results/cloudflare-vision-spike-run-diagnostics.json
          if-no-files-found: error
          retention-days: 1
