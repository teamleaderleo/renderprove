name: Inspect Cloudflare vision spike run

on:
  pull_request:
    paths:
      - .github/workflows/vision-wire-spike-recover.yml

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Collect bounded run diagnostics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const output = { runs: [], diagnostic: null };
          const classifyLog = (text) => {
            if (text.includes('Cloudflare spike credentials are unavailable.')) return 'credentials-unavailable';
            if (text.includes('ERR_MODULE_NOT_FOUND')) return 'module-load-error';
            if (text.includes('browserType.launch')) return 'browser-launch-error';
            if (text.includes('SyntaxError')) return 'runner-syntax-error';
            if (text.includes('response-too-large')) return 'response-too-large';
            return 'unclassified-runner-failure';
          };
          try {
            const headers = {
              Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
            };
            const base = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}`;
            const runsResponse = await fetch(`${base}/actions/runs?branch=docs%2Fissue-29-cloudflare-vision-findings&event=push&per_page=20`, { headers });
            if (!runsResponse.ok) {
              output.diagnostic = { stage: 'list-runs', httpStatus: runsResponse.status };
            } else {
              const runPayload = await runsResponse.json();
              const selected = (runPayload.workflow_runs ?? []).filter((run) => run.name === 'Synthetic Cloudflare vision wire spike').slice(0, 5);
              for (const run of selected) {
                const jobsResponse = await fetch(`${base}/actions/runs/${run.id}/jobs?per_page=100`, { headers });
                const jobsPayload = jobsResponse.ok ? await jobsResponse.json() : { jobs: [] };
                const jobs = [];
                for (const job of (jobsPayload.jobs ?? [])) {
                  let failureClass = null;
                  let logsHttpStatus = null;
                  if (job.conclusion === 'failure') {
                    const logsResponse = await fetch(`${base}/actions/jobs/${job.id}/logs`, { headers });
                    logsHttpStatus = logsResponse.status;
                    if (logsResponse.ok) failureClass = classifyLog(await logsResponse.text());
                  }
                  jobs.push({
                    id: job.id,
                    name: job.name,
                    status: job.status,
                    conclusion: job.conclusion,
                    logsHttpStatus,
                    failureClass,
                    steps: (job.steps ?? []).map((step) => ({
                      name: step.name,
                      status: step.status,
                      conclusion: step.conclusion,
                    })),
                  });
                }
                output.runs.push({
                  id: run.id,
                  runNumber: run.run_number,
                  headSha: run.head_sha,
                  status: run.status,
                  conclusion: run.conclusion,
                  createdAt: run.created_at,
                  updatedAt: run.updated_at,
                  jobsHttpStatus: jobsResponse.status,
                  jobs,
                });
              }
            }
          } catch (error) {
            output.diagnostic = { stage: 'exception', name: error?.name ?? 'Error' };
          }
          fs.mkdirSync('test-results', { recursive: true });
          fs.writeFileSync('test-results/cloudflare-vision-spike-run-diagnostics.json', `${JSON.stringify(output, null, 2)}\n`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-vision-spike-run-diagnostics
          path: test-results/cloudflare-vision-spike-run-diagnostics.json
          if-no-files-found: error
          retention-days: 1
