name: Archimedes docs token measure

on:
  push:
    branches:
      - archimedes/docs-compress-readme
    paths:
      - .github/workflows/archimedes-doc-token-measure.yml

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tokenizer
        run: python -m pip install --disable-pip-version-check tiktoken==0.14.0
      - name: Measure README
        env:
          BASE_SHA: 520d11ccd8e5025d33cb9a03db2afcf8ba083b62
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          import tiktoken

          path = "README.md"
          base_sha = os.environ["BASE_SHA"]
          encoding_name = "o200k_base"
          encoding = tiktoken.get_encoding(encoding_name)
          before = subprocess.check_output(["git", "show", f"{base_sha}:{path}"], text=True)
          after = Path(path).read_text(encoding="utf-8")
          before_tokens = len(encoding.encode(before, disallowed_special=()))
          after_tokens = len(encoding.encode(after, disallowed_special=()))
          receipt = {
              "schema": "archimedes-doc-token-receipt/v1",
              "tiktokenVersion": tiktoken.__version__,
              "encoding": encoding_name,
              "baseSha": base_sha,
              "headSha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "file": path,
              "beforeTokens": before_tokens,
              "afterTokens": after_tokens,
              "deltaTokens": after_tokens - before_tokens,
              "reductionPercent": round((before_tokens - after_tokens) * 100 / before_tokens, 3),
              "beforeBytes": len(before.encode("utf-8")),
              "afterBytes": len(after.encode("utf-8")),
          }
          print("ARCHIMEDES_TOKEN_RECEIPT=" + json.dumps(receipt, sort_keys=True))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as out:
              out.write("## Archimedes docs token receipt\n\n```json\n")
              out.write(json.dumps(receipt, indent=2, sort_keys=True))
              out.write("\n```\n")
          PY
