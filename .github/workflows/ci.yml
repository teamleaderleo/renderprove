name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:package
      - run: mkdir -p test-results && node --test --test-reporter=spec 2>&1 | tee test-results/core.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderprove-core-results
          path: test-results/core.txt
          if-no-files-found: error
          retention-days: 7

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderprove-browser-receipt
          path: tests/fixtures/site/.proof
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build worker image
        run: |
          playwright_version="$(node -p "require('./package.json').dependencies.playwright")"
          docker build \
            --build-arg "PLAYWRIGHT_VERSION=${playwright_version}" \
            --file build/worker/Containerfile \
            --tag renderprove-worker:test \
            .
      - name: Repeat fixture in fresh workers
        run: |
          root="tests/fixtures/site/.worker-repeatability"
          rm -rf "${root}"
          mkdir -p "${root}/runs"
          image_id="$(docker image inspect --format '{{.Id}}' renderprove-worker:test)"

          for run in 001 002 003; do
            run_root="${root}/runs/${run}"
            mkdir -p "${run_root}"

            docker run --rm --init --ipc=host --network=none \
              --user "$(id -u):$(id -g)" \
              --cap-drop=ALL --security-opt no-new-privileges \
              --pids-limit=768 --memory=2g --cpus=2 \
              --tmpfs /tmp:rw,nosuid,nodev,size=1g \
              --entrypoint node \
              --env RENDERPROVE_WORKER_IMAGE=renderprove-worker:test \
              --env "RENDERPROVE_WORKER_IMAGE_ID=${image_id}" \
              renderprove-worker:test \
              /opt/renderprove/scripts/worker-identity.mjs \
              > "${run_root}/worker.json"

            node -e "const value=require('./' + process.argv[1]); if (value.version !== 1 || value.browser?.name !== 'chromium' || !value.fonts?.sha256) process.exit(1)" "${run_root}/worker.json"

            set +e
            docker run --rm --init --ipc=host --network=none \
              --user "$(id -u):$(id -g)" \
              --cap-drop=ALL --security-opt no-new-privileges \
              --pids-limit=768 --memory=2g --cpus=2 \
              --tmpfs /tmp:rw,nosuid,nodev,size=1g \
              --volume "${GITHUB_WORKSPACE}/tests/fixtures/site:/workspace/project:rw" \
              renderprove-worker:test \
              review /workspace/project --output ".worker-repeatability/runs/${run}" --json \
              > "${run_root}/review.stdout.json" \
              2> "${run_root}/review.stderr.txt"
            status=$?
            set -e
            cat "${run_root}/review.stderr.txt"
            if [ "${status}" -ne 0 ]; then exit "${status}"; fi
            node -e "const value=require('./' + process.argv[1]); if (value.status !== 'passed' || value.cases?.length !== 2) process.exit(1)" "${run_root}/receipt.json"
          done

          set +e
          node scripts/repeatability-report.mjs "${root}" > "${root}/repeatability.json.tmp"
          status=$?
          set -e
          mv "${root}/repeatability.json.tmp" "${root}/repeatability.json"
          cat "${root}/repeatability.json"
          exit "${status}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderprove-worker-repeatability
          path: tests/fixtures/site/.worker-repeatability
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
