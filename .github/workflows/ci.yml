name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm run check:package
      - run: mkdir -p test-results && node --test --test-reporter=spec 2>&1 | tee test-results/core.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderprove-core-results
          path: test-results/core.txt
          if-no-files-found: error
          retention-days: 7
      - name: Commit generated lockfile
        if: github.event_name == 'pull_request' && github.actor == 'teamleaderleo' && github.head_ref == 'feat/local-stdio-mcp'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          cp package-lock.json /tmp/renderprove-package-lock.json
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" FETCH_HEAD
          cp /tmp/renderprove-package-lock.json package-lock.json
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Lock MCP dependencies"
          git push origin "HEAD:$HEAD_REF"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderprove-browser-receipt
          path: tests/fixtures/site/.proof
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
